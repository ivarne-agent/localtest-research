name: localtest

# One origin for apps and platform: http://local.altinn.cloud:8000 (add "127.0.0.1 local.altinn.cloud" to /etc/hosts).
# The localtest app has a fixed address and every component maps local.altinn.cloud to it, so service-to-service calls
# use the same public URLs the browser and the app use. (podman copies the host's /etc/hosts into containers, where
# local.altinn.cloud would otherwise point at the container itself; an added host entry wins.)
# Apps run on the developer machine and are reached through host.docker.internal on the port run-app.sh registered.

x-platform-host: &platform-host
  extra_hosts:
    - "local.altinn.cloud:10.200.0.10"

# Platform access tokens: every app and component signs them with the same test certificate (certs/README.md) and
# the components validate them against it, so the production token handlers run unchanged.
x-access-token-cert: &access-token-cert
  AccessTokenSettings__AccessTokenSigningCertificateFullPath: /certs/localtest-accesstoken.pfx

networks:
  default:
    ipam:
      config:
        # Dynamic addresses come from the upper half only, so no container started before the localtest app can take its
        # fixed 10.200.0.10 (after a reboot podman starts the containers in dependency order, the localtest app last).
        - subnet: 10.200.0.0/24
          ip_range: 10.200.0.128/25

services:
  # The localtest app (localtest/, Native AOT), the front door: its proxy routes the platform by host and path prefix
  # and the apps the app runner pushes (PUT localtest/api/proxy/apps/{org}/{app}). Upstreams default to the services
  # below; override one with Proxy__Upstreams__<name>, for example
  # Proxy__Upstreams__storage: http://host.docker.internal:5010 for a Storage run from an IDE.
  localtest:
    build: ./localtest
    image: localhost/localtest-localtest:dev
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The built app-frontend (src/App/frontend/dist) served at /app-frontend/; apps run with
      # AppSettings__AppFrontendAssetBaseUrl=http://local.altinn.cloud:8000/app-frontend
      - ${FRONTEND_DIST:-./frontend-dist}:/frontend:ro
      # The registered app routes, so a recreated container keeps routing the apps that still run.
      - localtest-data:/data
    networks:
      default:
        ipv4_address: 10.200.0.10
        aliases:
          - local.altinn.cloud
    depends_on:
      - register
      - authentication
      - authorization
      - storage
      - events
      - pdf3
      - workflow-engine

  register:
    <<: *platform-host
    build: ./components/register
    image: localhost/localtest-register:dev
    environment:
      <<: *access-token-cert
      GeneralSettings__OpenIdWellKnownEndpoint: http://local.altinn.cloud:8000/authentication/api/v1/openid/
      PlatformSettings__ApiAuthorizationEndpoint: http://local.altinn.cloud:8000/authorization/api/v1/
    volumes:
      - ./certs:/certs:ro
      - ./components/register/testdata:/testdata:ro

  authentication:
    <<: *platform-host
    build: ./components/authentication
    image: localhost/localtest-authentication:dev
    environment:
      <<: *access-token-cert
      GeneralSettings__PlatformEndpoint: http://local.altinn.cloud:8000/
    volumes:
      - ./certs:/certs:ro
    depends_on:
      - register

  authorization:
    <<: *platform-host
    build: ./components/authorization
    image: localhost/localtest-authorization:dev
    environment:
      <<: *access-token-cert
      Localtest__Authorization__PlatformEndpoint: http://local.altinn.cloud:8000/
    volumes:
      - ./certs:/certs:ro
      - ./components/authorization/policies:/policies:ro
      # App policies (written by the PDP's production policy endpoint) and delegation policies (written by Access
      # Management) in one store, as production's shared blob account.
      - policy-store:/policy-store
    depends_on:
      - register

  # Production Access Management (altinn-auth) on the shared Postgres (own database, created on start) with a
  # file-backed policy store instead of Azure Blob. Step 1 of planned-components/access-management: boots and seeds;
  # not yet routed through the proxy, so port 5080 is published for verification.
  access-management:
    <<: *platform-host
    build: ./components/access-management
    image: localhost/localtest-access-management:dev
    environment:
      <<: *access-token-cert
      Localtest__AccessManagement__PlatformEndpoint: http://local.altinn.cloud:8000/
    ports:
      - "5080:5080"
    volumes:
      - ./certs:/certs:ro
      - policy-store:/policy-store
    depends_on:
      postgres:
        condition: service_healthy
      register:
        condition: service_started

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./components/storage/postgres-init/10-storage.sh:/docker-entrypoint-initdb.d/10-storage.sh:ro
      - ./components/storage/vendor/infra/postgres_init.sql:/storage-init/postgres_init.sql:ro
      - ./postgres-init/20-workflow-engine.sh:/docker-entrypoint-initdb.d/20-workflow-engine.sh:ro
      - ./components/events/postgres-init/30-events.sh:/docker-entrypoint-initdb.d/30-events.sh:ro
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "storagedb"]
      interval: 2s
      retries: 30

  storage:
    <<: *platform-host
    build: ./components/storage
    image: localhost/localtest-storage:dev
    environment:
      <<: *access-token-cert
      GeneralSettings__PlatformEndpoint: http://local.altinn.cloud:8000/
      PostgreSqlSettings__AdminConnectionString: Host=postgres;Port=5432;Username=platform_storage_admin;Password={0};Database=storagedb
      PostgreSqlSettings__ConnectionString: Host=postgres;Port=5432;Username=platform_storage;Password={0};Database=storagedb;Include Error Detail=True
    volumes:
      - ./certs:/certs:ro
      - storage-blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy

  # Production Altinn Events on the shared Postgres (database eventsdb, emptied on every start): apps publish to
  # events/api/v1/app, webhooks inside the stack are delivered, others captured; events/api/localtest/ shows it all.
  events:
    <<: *platform-host
    build: ./components/events
    image: localhost/localtest-events:dev
    environment:
      <<: *access-token-cert
      Localtest__Events__PlatformEndpoint: http://local.altinn.cloud:8000/
      PostgreSQLSettings__AdminConnectionString: Host=postgres;Port=5432;Username=platform_events_admin;Password={0};Database=eventsdb
      PostgreSQLSettings__ConnectionString: Host=postgres;Port=5432;Username=platform_events;Password={0};Database=eventsdb;Include Error Detail=True
    volumes:
      - ./certs:/certs:ro
      # Events never binds AccessTokenSettings for its outgoing platform tokens (to Register), so the production
      # SigningCredentialsResolver reads its default path, ../accesstoken/accesstokencredentials.pfx from /app.
      - ./certs/localtest-accesstoken.pfx:/accesstoken/accesstokencredentials.pfx:ro
    depends_on:
      postgres:
        condition: service_healthy
      register:
        condition: service_started
      authorization:
        condition: service_started

  # PDF generator from the monorepo (src/Runtime/pdf3/Dockerfile.worker), image built by studioctl dev mode as
  # localtest-pdf3:dev; the app reaches it at http://pdf.local.altinn.cloud:8000/pdf through the proxy.
  pdf3:
    <<: *platform-host
    image: localhost/localtest-pdf3:dev
    environment:
      TZ: Europe/Oslo
      PDF3_ENVIRONMENT: localtest
      PDF3_QUEUE_SIZE: "3"
      PDF3_LOCALTEST_PUBLIC_BASE_URL: http://local.altinn.cloud:8000

  # Workflow engine from the monorepo (src/Runtime/workflow-engine-app/Dockerfile), image built by studioctl dev mode
  # as localtest-workflow-engine:dev. The app reaches it at http://workflow-engine.local.altinn.cloud:8000/api/v1/;
  # it calls the app back through the proxy.
  workflow-engine:
    <<: *platform-host
    image: localhost/localtest-workflow-engine:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "9090"
      ConnectionStrings__WorkflowEngine: Host=postgres;Port=5432;Database=workflow_engine;Username=postgres;Password=postgres
      AppCommandSettings__CommandEndpoint: http://local.altinn.cloud:8000/{Org}/{App}/instances/{InstanceOwnerPartyId}/{InstanceGuid}/workflow-engine-callbacks/
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  localtest-data:
  postgres-data:
  storage-blobs:
  policy-store:

