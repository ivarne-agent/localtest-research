name: localtest

# One origin for apps and platform: http://local.altinn.cloud:8000 (add "127.0.0.1 local.altinn.cloud" to /etc/hosts).
# The ingress has a fixed address and every component maps local.altinn.cloud to it, so service-to-service calls
# use the same public URLs the browser and the app use. (podman copies the host's /etc/hosts into containers, where
# local.altinn.cloud would otherwise point at the container itself; an added host entry wins.)
# Apps run on the developer machine (port 5005) and are reached through host.docker.internal.

x-platform-host: &platform-host
  extra_hosts:
    - "local.altinn.cloud:10.200.0.10"

networks:
  default:
    ipam:
      config:
        - subnet: 10.200.0.0/24

services:
  ingress:
    build: ./ingress
    image: localhost/localtest-ingress:dev
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTHORIZATION_UPSTREAM: http://authorization:5070
      STORAGE_UPSTREAM: http://storage:5010
    networks:
      default:
        ipv4_address: 10.200.0.10
        aliases:
          - local.altinn.cloud
    depends_on:
      - register
      - authentication
      - authorization
      - storage

  register:
    <<: *platform-host
    build: ./components/register
    image: localhost/localtest-register:dev
    environment:
      GeneralSettings__OpenIdWellKnownEndpoint: http://local.altinn.cloud:8000/authentication/api/v1/openid/
      PlatformSettings__ApiAuthorizationEndpoint: http://local.altinn.cloud:8000/authorization/api/v1/
      Localtest__Register__RequirePlatformAccessTokenHeader: "true"
    volumes:
      - ./components/register/testdata:/testdata:ro

  authentication:
    <<: *platform-host
    build: ./components/authentication
    image: localhost/localtest-authentication:dev
    environment:
      GeneralSettings__PlatformEndpoint: http://local.altinn.cloud:8000/
    depends_on:
      - register

  authorization:
    <<: *platform-host
    build: ./components/authorization
    image: localhost/localtest-authorization:dev
    environment:
      Localtest__Authorization__PlatformEndpoint: http://local.altinn.cloud:8000/
    volumes:
      - ./components/authorization/policies:/policies:ro
    depends_on:
      - register

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./components/storage/postgres-init/10-storage.sh:/docker-entrypoint-initdb.d/10-storage.sh:ro
      - ./components/storage/vendor/infra/postgres_init.sql:/storage-init/postgres_init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "storagedb"]
      interval: 2s
      retries: 30

  storage:
    <<: *platform-host
    build: ./components/storage
    image: localhost/localtest-storage:dev
    environment:
      GeneralSettings__PlatformEndpoint: http://local.altinn.cloud:8000/
      PostgreSqlSettings__AdminConnectionString: Host=postgres;Port=5432;Username=platform_storage_admin;Password={0};Database=storagedb
      PostgreSqlSettings__ConnectionString: Host=postgres;Port=5432;Username=platform_storage;Password={0};Database=storagedb;Include Error Detail=True
    volumes:
      - storage-blobs:/data/blobs
      - ./apps:/apps:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  storage-blobs:
