# localtest: derived from vendor/packages/frontend/nginx.conf (upstream's, at the pin in vendor/UPSTREAM.md). Upstream's
# lines are kept in its order; every change is a "localtest:" comment above the line it concerns. Upstream serves only
# the SPA from this file; its /api/ reaches the BFF through traefik (compose.yml) or Azure's ingress, which here is the
# /api/ location below. studioctl-server forwards every path on af.local.altinn.cloud:8000 to this server and keeps the
# Host header; Set-Cookie passes it unchanged, and the BFF sets no Secure cookie over http (patch 0003).
server {
  listen 80;

  # Hide nginx version and server header
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types application/javascript text/css image/svg+xml application/json;

  # Security Headers - applied globally with 'always' to work in all location blocks
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=(), local-network=()" always;
  # localtest: no Strict-Transport-Security. Browsers ignore it over http, but one that once saw it for this host over
  # https would refuse plain http afterwards.
  # localtest: connect-src and img-src also allow the stack's origin, http://local.altinn.cloud:8000 (nginx-start.sh
  # replaces it with the origin of DIALOGPORTEN_STREAM_URL), which upstream's
  # "https:" does not cover: the SPA's subscription stream to Dialogporten's GraphQL (DIALOGPORTEN_STREAM_URL), the dialog
  # content and transmission receipts it fetches with the dialog token, and images on the platform host.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.monitor.azure.com; connect-src 'self' http://local.altinn.cloud:8000 https:; img-src 'self' data: http://local.altinn.cloud:8000 https:; style-src 'self' 'unsafe-inline' https://altinncdn.no; font-src 'self' data: https://altinncdn.no; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

  # localtest: the BFF, as upstream's traefik routes Host(app.localhost) && PathPrefix(/api) to it. arbeidsflate-bff is
  # the BFF container's alias on the stack's network. Through a variable, nginx resolves it per request (the resolver
  # nginx-start.sh writes, cached 10 s), so a restarted BFF with a new address is found; a literal host would be
  # resolved once at start (a 502 after every BFF restart). Without a URI part the request's URI is passed unchanged.
  # ^~ keeps the regex locations below (.js, .html, ...) from taking BFF paths such as GraphiQL's assets.
  location ^~ /api/ {
    set $arbeidsflate_bff http://arbeidsflate-bff:80;
    proxy_pass $arbeidsflate_bff;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # No X-Forwarded-Proto of our own: the BFF's cookies are `secure: 'auto'` (patch 0003), so Fastify (trustProxy) sees
    # the stack's http and sets them without Secure. Sending https here would turn Secure back on (fastifyHeaders.ts).
    # Streams (GraphiQL's subscriptions) pass unbuffered; a slow upstream call gets five minutes, as the front door's.
    proxy_buffering off;
    proxy_read_timeout 300s;
    # The BFF sets its own security headers (helmet); one add_header here stops the server-level ones above from being
    # added to its responses as well, which upstream's ingress does not do.
    add_header X-Localtest-Upstream "arbeidsflate-bff" always;
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }

  # Cache control for index.html - no caching since name changes on deploy
  location ~* \.html$ {
    root   /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # Cache control for static assets (JS, CSS, images, fonts) - aggressive caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    root   /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
