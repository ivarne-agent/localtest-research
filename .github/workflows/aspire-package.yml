# Builds, tests and packs the Aspire hosting package Altinn.App.Aspire (localtest/aspire/Altinn.App.Aspire) and pushes it
# to this repository owner's NuGet feed on GitHub Packages as 0.1.0-alpha.<run number>; the .nupkg is also a workflow
# artifact. A tag aspire-v<version> (aspire-v0.1.0) packs that version and attaches the .nupkg to a GitHub release, the
# token-free way to get it. The package embeds studioctl's manifest and the shared test certificate from the studioctl
# tree, and its tests read studioctl's container, app environment and app codes golden files, so changes there build it
# too.
name: aspire-package

on:
  push:
    branches: [main]
    tags: ["aspire-v*"]
    paths:
      - "localtest/aspire/**"
      - "localtest/studioctl/src/cli/internal/localtestv2/manifest/**"
      - "localtest/studioctl/src/cli/internal/cmd/env/localtestv2/assets/**"
      - "localtest/studioctl/src/cli/internal/cmd/env/localtestv2/testdata/**"
      - "localtest/studioctl/src/cli/internal/cmd/app/testdata/**"
      - "localtest/studioctl/src/cli/internal/appsecrets/testdata/**"
      - ".github/workflows/aspire-package.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_DIR: localtest/aspire/Altinn.App.Aspire
  FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release on an aspire-v* tag
      packages: write # the push to GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ env.PACKAGE_DIR }}/global.json
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "version=${REF_NAME#aspire-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-alpha.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Format
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          dotnet tool restore
          dotnet csharpier check .
      - name: Build
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          dotnet build -c Release src
          dotnet build -c Release tests
      - name: Test
        working-directory: ${{ env.PACKAGE_DIR }}
        run: dotnet test tests -c Release --no-build
      - name: Build the sample AppHosts and apps
        working-directory: localtest/aspire/samples/app
        run: |
          dotnet build -c Release AppHost/apphost.cs
          dotnet build -c Release AppHost/apphost-minimal.cs
      - name: Pack
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src -c Release -p:Version="$VERSION" -o "$RUNNER_TEMP/nupkg"
      - uses: actions/upload-artifact@v4
        with:
          name: Altinn.App.Aspire.${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/nupkg/*.nupkg
      - name: Push to GitHub Packages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "$RUNNER_TEMP"/nupkg/*.nupkg --source "$FEED" --api-key "$TOKEN" --skip-duplicate
      - name: Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'aspire-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/nupkg/*.nupkg \
            --title "Altinn.App.Aspire $VERSION" \
            --notes "The Aspire hosting package for the localtest platform; see localtest/aspire/Altinn.App.Aspire/README.md."
