# Parity of the two runtimes of the localtest-v2 stack: studioctl's `env up` / `run` and the Aspire hosting package
# (localtest/aspire/Altinn.App.Aspire) read one component manifest
# (localtest/studioctl/src/cli/internal/localtestv2/manifest/manifest.json) and share the provisioning library. Three
# jobs, on every change to the manifest, the Go loaders, the package or the provisioning library:
#
# - go: `go build ./... && go test ./...` under studioctl's src/cli. Besides the manifest's own checks (schema, Parse,
#   Postgres init scripts, dev build Dockerfiles), this is the stale-golden check: the golden tests compare what the
#   loaders build from the manifest with the snapshots checked in beside them
#   (internal/cmd/env/localtestv2/testdata/environment.golden.json, internal/cmd/app/testdata/app-environment.golden.json,
#   internal/appsecrets/testdata/app-codes.golden.json), so a manifest or loader change without a reviewed, regenerated
#   snapshot (STUDIOCTL_UPDATE_GOLDEN=1 go test ./...) fails here.
# - dotnet: the package's tests, which read those same golden files by relative path and fail when the C# reader
#   resolves the manifest differently from studioctl, and the provisioning library's tests.
# - schema: the manifest against its JSON Schema with a full validator (python3 -m jsonschema), independent of the Go
#   test's small validator, as the manifest README documents.
#
# aspire-package.yml builds and publishes the package on main; this workflow is the check on pull requests.
name: manifest-parity

on:
  pull_request:
    paths: &paths
      - "localtest/studioctl/src/cli/internal/localtestv2/**"
      - "localtest/studioctl/src/cli/internal/cmd/env/localtestv2/**"
      - "localtest/studioctl/src/cli/internal/cmd/app/**"
      - "localtest/studioctl/src/cli/internal/appsecrets/**"
      - "localtest/studioctl/src/cli/internal/config/**"
      - "localtest/studioctl/src/cli/internal/envtopology/**"
      - "localtest/studioctl/src/cli/go.mod"
      - "localtest/studioctl/src/cli/go.sum"
      - "localtest/studioctl/src/Runtime/devenv/**"
      - "localtest/studioctl/src/Runtime/common/dotnet/Altinn.Studio.Localtest.Provisioning/**"
      - "localtest/postgres/Dockerfile"
      - "localtest/aspire/**"
      - ".github/workflows/manifest-parity.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manifest-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  CLI_DIR: localtest/studioctl/src/cli
  MANIFEST_DIR: localtest/studioctl/src/cli/internal/localtestv2/manifest
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.CLI_DIR }}/go.mod
          cache-dependency-path: ${{ env.CLI_DIR }}/go.sum
      - name: Build
        working-directory: ${{ env.CLI_DIR }}
        run: go build ./...
      - name: Test (manifest checks and the stale-golden check)
        working-directory: ${{ env.CLI_DIR }}
        run: go test ./...

  dotnet:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project:
          # The package's tests: the C# manifest reader and the app section against studioctl's golden files.
          - { name: Altinn.App.Aspire, dir: localtest/aspire/Altinn.App.Aspire }
          # The provisioning library both runners compile in.
          - { name: Altinn.Studio.Localtest.Provisioning, dir: localtest/studioctl/src/Runtime/common/dotnet/Altinn.Studio.Localtest.Provisioning }
    name: dotnet (${{ matrix.project.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ matrix.project.dir }}/global.json
      - name: Test
        working-directory: ${{ matrix.project.dir }}
        run: dotnet test tests -c Release

  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install jsonschema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "jsonschema==4.26.0"
      - name: Validate the manifest against its schema
        working-directory: ${{ env.MANIFEST_DIR }}
        # Silent when valid; the CLI's deprecation warning is not an error.
        run: '"$RUNNER_TEMP/venv/bin/python" -W ignore::DeprecationWarning -m jsonschema -i manifest.json manifest.schema.json'
